<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REA Desain Rumah</title>
  </head>
  <body>
    <header id="toolbar"></header>
    <div id="workspace">
      <nav id="palette" aria-label="Alat gambar"></nav>
      <main id="views">
        <section class="pane" id="plan-pane">
          <canvas id="plan"></canvas>
        </section>
        <section class="pane" id="view3d-pane"></section>
      </main>
      <aside id="sidebar" aria-label="Layer dan properti">
        <section id="layers"></section>
      </aside>
    </div>
    <footer id="commandbar">
      <form id="command" autocomplete="off">
        <label for="command-input" id="command-prompt">Perintah:</label>
        <input id="command-input" spellcheck="false" placeholder="ketik perintah (DINDING, PINTU, ZOOM…) atau panjang" />
      </form>
      <span id="status"></span>
    </footer>
    <div id="toast" role="status" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
